<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ScribbleChat</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='register.css' )}}">
</head>
<body>
    <div class="contenedor">
        <form action="{{ url_for('register') }}" method="post" class="formulario">
            <h2>Registro</h2>
            {% if mesage is defined and mesage %}
                <div class="alert alert-warning">{{ mesage }}</div>
            {% endif %}
            <div class="form-group">
                <label for="name">Nombre:</label>
                <input type="text" class="form-control" id="name" name="name" placeholder="Ingresa nombre usuario">
            </div>
            <div class="form-group">
                <label for="email">Correo:</label>
                <input type="email" class="form-control" id="email" name="email" placeholder="Ingresa correo electronico">
            </div>
            <div class="form-group">
                <label for="pwd">Contraseña:</label>
                <input type="password" class="form-control" id="password" name="password" placeholder="Ingresa contraseña">
            </div>
            <button type="submit" class="btn btn-primary button">Registrar</button>
            <p class="bottom">¿No tiene una cuenta? <a class="bottom link" href="{{url_for('login')}}">Entre aquí</a></p>
        </form>
    </div>
</body>
</html>
